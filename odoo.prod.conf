[options]
; Configuración de PRODUCCIÓN — easyway_for_odoo
; Requiere nginx/apache como proxy (proxy_mode = True) y ajustar workers
; según CPU/RAM del servidor (regla aprox: workers = 1 + threads_CPU * 1.2)
addons_path = /opt/odoo/odoo18/addons,/opt/odoo/odoo18/odoo/addons
; ¡GENERAR un secret fuerte! ej: python3 -c "import secrets; print(secrets.token_hex(16))"
admin_passwd = CHANGE_ME
data_dir = /var/lib/odoo
db_host = localhost
db_maxconn = 64
db_port = 5432
db_sslmode = prefer
db_template = template0
db_user = odoo
db_password = CHANGE_ME
; en producción limita la lista de bases visibles
dbfilter = .*
email_from = False
http_enable = True
http_interface = 127.0.0.1
http_port = 8069
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = -1
; nunca exponer el selector de bases en producción
list_db = False
log_handler = :INFO
log_level = info
logfile = /var/log/odoo/odoo.log
max_cron_threads = 2
proxy_mode = True
server_wide_modules = base,web
smtp_password = False
smtp_port = 25
smtp_server = localhost
smtp_ssl = False
smtp_user = False
syslog = False
transient_age_limit = 1.0
unaccent = False
upgrade_path =
without_demo = True
workers = 2
