[options]
; Plantilla de configuración para el workspace de VSCode (desarrollo)
; Ajusta addons_path y data_dir a tu instalación real.
addons_path = /opt/odoo/odoo18/addons,/opt/odoo/odoo18/odoo/addons
admin_passwd = CHANGE_ME
data_dir = /home/esfingex/.local/share/Odoo
db_host = localhost
db_maxconn = 64
db_port = 5432
db_sslmode = prefer
db_template = template0
db_user = odoo
db_password = CHANGE_ME
dbfilter =
http_enable = True
http_interface = 127.0.0.1
http_port = 8073
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = -1
list_db = True
log_handler = :INFO
log_level = info
max_cron_threads = 2
proxy_mode = False
server_wide_modules = base,web
test_enable = False
without_demo = False
workers = 0
